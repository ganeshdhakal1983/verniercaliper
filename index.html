<script>
const pages={"Step Turning": "<!DOCTYPE html>\n<html>\n<head><meta charset=\"utf-8\"><title>Step Turning Animation<\/title><\/head>\n<body style=\"font-family:Arial;text-align:center;background:#f4f4f4\">\n<h3>Step Turning on a Lathe: Ø50 → Ø45, Ø35, Ø25 (20 mm each)<\/h3>\n<canvas id=\"c\" width=\"900\" height=\"380\" style=\"background:#fff;border:1px solid #999\"><\/canvas>\n<p><button onclick=\"restart()\">Restart<\/button><\/p>\n<script>\nconst cv=document.getElementById('c'),g=cv.getContext('2d');\nconst S=4, X0=160, CY=210, L=80;          // 4 px per mm, 80 mm bar\nconst passes=[{d:45,end:20},{d:35,end:40},{d:25,end:60}]; // end = mm from chuck\nlet r, p, phase, tx, ty, msg;\nfunction restart(){\n  r=Array(L).fill(25); p=0; phase='infeed';\n  tx=X0+L*S+30; ty=CY-25*S-60; msg='Start: Ø50 bar held in chuck';\n}\nrestart();\nfunction step(){\n  const P=passes[p]; if(!P){msg='Finished: Ø45, Ø35, Ø25, each 20 mm long';return;}\n  const targetY=CY-(P.d/2)*S, endX=X0+P.end*S, speed=1.2;\n  if(phase==='infeed'){\n    msg='Pass '+(p+1)+': set depth of cut to Ø'+P.d;\n    if(ty<targetY-0.0) ty+=1; if(ty>=targetY){ty=targetY;phase='cut';}\n  } else if(phase==='cut'){\n    msg='Pass '+(p+1)+': tool feeds toward chuck, turning Ø'+P.d+' for '+(P.end===20?60:P.end===40?40:20)+' mm';\n    tx-=speed;\n    for(let c=0;c<L;c++){const x=X0+c*S;\n      if(x>=tx && c>=P.end) r[c]=Math.min(r[c],P.d/2);}\n    if(tx<=endX){phase='retract';}\n  } else if(phase==='retract'){\n    msg='Pass '+(p+1)+' done: retract tool';\n    ty-=2; if(ty<CY-25*S-60){phase='return';}\n  } else if(phase==='return'){\n    msg='Return tool to tailstock end';\n    tx+=4; if(tx>=X0+L*S+30){p++;phase='infeed';}\n  }\n}\nfunction draw(){\n  g.clearRect(0,0,900,380);\n  // centre line\n  g.setLineDash([12,4,2,4]);g.strokeStyle='#c00';g.beginPath();g.moveTo(60,CY);g.lineTo(560,CY);g.stroke();g.setLineDash([]);\n  // chuck\n  g.fillStyle='#555';g.fillRect(90,CY-70,70,140);\n  g.fillStyle='#888';g.fillRect(40,CY-30,50,60);\n  // workpiece\n  g.fillStyle='#b0b7c3';g.strokeStyle='#222';\n  for(let c=0;c<L;c++){const h=r[c]*S;g.fillRect(X0+c*S,CY-h,S+0.5,2*h);}\n  g.beginPath();g.moveTo(X0,CY-r[0]*S);\n  for(let c=0;c<L;c++){g.lineTo(X0+c*S,CY-r[c]*S);g.lineTo(X0+(c+1)*S,CY-r[c]*S);}\n  g.stroke();\n  g.beginPath();g.moveTo(X0,CY+r[0]*S);\n  for(let c=0;c<L;c++){g.lineTo(X0+c*S,CY+r[c]*S);g.lineTo(X0+(c+1)*S,CY+r[c]*S);}\n  g.stroke();\n  // tool (above work, tip touching surface)\n  g.fillStyle='#d35400';g.beginPath();\n  g.moveTo(tx,ty);g.lineTo(tx+30,ty-12);g.lineTo(tx+30,ty-70);g.lineTo(tx+90,ty-70);g.lineTo(tx+90,ty-12);g.lineTo(tx+50,ty-12);g.closePath();g.fill();\n  // dimension labels\n  g.fillStyle='#000';g.font='13px Arial';\n  const labels=[['Ø50',0],['Ø45',20],['Ø35',40],['Ø25',60]];\n  labels.forEach(([t,mm])=>{g.fillText(t+' × 20',X0+mm*S+8,CY+110);\n    g.strokeStyle='#06c';g.beginPath();g.moveTo(X0+mm*S,CY+85);g.lineTo(X0+mm*S,CY+120);g.stroke();});\n  g.beginPath();g.moveTo(X0+L*S,CY+85);g.lineTo(X0+L*S,CY+120);g.stroke();\n  g.font='bold 16px Arial';g.fillText(msg,40,40);\n  g.font='13px Arial';g.fillText('Chuck',95,CY-80);g.fillText('Tool',tx+40,ty-80);\n}\nfunction loop(){for(let i=0;i<2;i++)step();draw();requestAnimationFrame(loop);}\nloop();\n<\/script>\n<\/body>\n<\/html>", "Lathe Operations": "<!DOCTYPE html>\n<html>\n<head><meta charset=\"utf-8\"><title>Lathe: Facing, Step Turning, Chamfering, Knurling<\/title><\/head>\n<body style=\"font-family:Arial;text-align:center;background:#f4f4f4\">\n<h3>Lathe Operations on a Ø50 × 100 mm Rod<\/h3>\n<canvas id=\"c\" width=\"800\" height=\"400\" style=\"background:#fff;border:1px solid #999\"><\/canvas>\n<p><button onclick=\"init()\">Restart<\/button><\/p>\n<script>\nconst cv=document.getElementById('c'),g=cv.getContext('2d');\nconst S=4, X0=100, CY=200;            // 4 px per mm; bar starts at X0 (left end, inside chuck)\nconst topY=rr=>CY-rr*S;\nlet r,kn,tx,ty,steps,si,tool,done;\n\nfunction mv(x,y,sp){\n  const dx=x-tx,dy=y-ty,d=Math.hypot(dx,dy);\n  if(d<=sp){tx=x;ty=y;return true;}\n  tx+=dx/d*sp;ty+=dy/d*sp;return false;\n}\n\nfunction init(){\n  r=Array(100).fill(25); kn=Array(100).fill(false);\n  tx=X0+100*S+40; ty=topY(25)-30; tool='turn'; si=0; done=false;\n  steps=[];\n  const FX=X0+98*S;                       // after facing, free end is at 98 mm\n  // 1. FACING (remove 2 mm from the free end)\n  steps.push({m:'1. Facing: position tool at the free end',f:()=>mv(FX,topY(25)-5,4)});\n  steps.push({m:'1. Facing: cross-feed tool to centre (removes 2 mm)',f:()=>{\n      const d=mv(FX,CY,0.7);\n      for(let c=98;c<100;c++) r[c]=Math.max(0,Math.min(r[c],(CY-ty)/S));\n      return d;}});\n  steps.push({m:'1. Facing done: retract tool',f:()=>mv(FX+20,topY(25)-30,4)});\n  // 2. STEP TURNING\n  [[45,38],[35,58],[25,78]].forEach(([d,st],i)=>{\n    steps.push({m:'2. Turning pass '+(i+1)+': position tool',f:()=>mv(FX+20,topY(25)-30,5)});\n    steps.push({m:'2. Turning pass '+(i+1)+': set depth for Ø'+d,f:()=>mv(FX+20,topY(d/2),1.5)});\n    steps.push({m:'2. Turning pass '+(i+1)+': feed toward chuck, Ø'+d+' for '+(98-st)+' mm',f:()=>{\n      const dn=mv(X0+st*S,topY(d/2),1.2);\n      for(let c=st;c<98;c++) if(X0+c*S>=tx) r[c]=Math.min(r[c],d/2);\n      return dn;}});\n    steps.push({m:'2. Pass '+(i+1)+' complete: retract tool',f:()=>mv(tx,topY(25)-30,3)});\n  });\n  // 3. CHAMFERING (2 x 45 deg at free end of the last step)\n  steps.push({m:'3. Chamfering: position tool at end of Ø25 step',f:()=>mv(X0+96*S,topY(12.5)-30,5)});\n  steps.push({m:'3. Chamfering: touch surface',f:()=>mv(X0+96*S,topY(12.5),1.5)});\n  steps.push({m:'3. Chamfering: feed at 45° (2 × 45°)',f:()=>{\n      const dn=mv(X0+98*S,topY(10.5),0.5);\n      const tc=(tx-X0)/S;\n      for(let c=96;c<98;c++) if(c+0.5<=tc) r[c]=Math.min(r[c],12.5-(c+0.5-96));\n      return dn;}});\n  steps.push({m:'3. Chamfer done: retract tool',f:()=>mv(X0+98*S+20,topY(25)-30,4)});\n  // 4. KNURLING (roller tool on the Ø25 step)\n  steps.push({m:'4. Knurling: bring roller above the Ø25 step',tool:'roll',f:()=>mv(X0+96*S,topY(12.5)-30,5)});\n  steps.push({m:'4. Knurling: press roller into the work',tool:'roll',f:()=>mv(X0+96*S,topY(12.5)+2,0.5)});\n  steps.push({m:'4. Knurling: traverse along the step (diamond pattern forms)',tool:'roll',f:()=>{\n      const dn=mv(X0+78*S,ty,0.8);\n      for(let c=78;c<96;c++) if(X0+c*S>=tx) kn[c]=true;\n      return dn;}});\n  steps.push({m:'4. Knurling done: retract roller',tool:'roll',f:()=>mv(tx,topY(25)-30,3)});\n  steps.push({m:'Finished: faced, stepped Ø45/Ø35/Ø25 (20 mm each), chamfered and knurled',tool:'roll',f:()=>{done=true;return true;}});\n}\ninit();\n\nfunction update(){\n  if(done) return;\n  const s=steps[si]; tool=s.tool||'turn';\n  if(s.f()) si++;\n}\n\nfunction drawTool(){\n  if(tool==='turn'){\n    g.fillStyle='#d35400';g.beginPath();\n    g.moveTo(tx,ty);g.lineTo(tx+30,ty-12);g.lineTo(tx+30,ty-70);\n    g.lineTo(tx+90,ty-70);g.lineTo(tx+90,ty-12);g.lineTo(tx+50,ty-12);g.closePath();g.fill();\n  } else {\n    g.fillStyle='#d35400';g.fillRect(tx-10,ty-60,20,30);g.fillRect(tx-25,ty-32,50,6);\n    g.fillStyle='#777';g.strokeStyle='#222';g.beginPath();g.arc(tx,ty-14,14,0,7);g.fill();g.stroke();\n    g.fillStyle='#222';g.beginPath();g.arc(tx,ty-14,3,0,7);g.fill();\n  }\n}\n\nfunction draw(){\n  g.clearRect(0,0,800,400);\n  g.setLineDash([12,4,2,4]);g.strokeStyle='#c00';g.beginPath();\n  g.moveTo(40,CY);g.lineTo(640,CY);g.stroke();g.setLineDash([]);\n  // workpiece\n  g.fillStyle='#b0b7c3';\n  for(let c=0;c<100;c++){const h=r[c]*S;if(h>0)g.fillRect(X0+c*S,CY-h,S+0.6,2*h);}\n  g.strokeStyle='#222';\n  [-1,1].forEach(sg=>{g.beginPath();\n    for(let c=0;c<100;c++){ if(r[c]<=0)break;\n      const y=CY+sg*r[c]*S; if(c===0)g.moveTo(X0,y);else g.lineTo(X0+c*S,y);\n      g.lineTo(X0+(c+1)*S,y);}\n    g.stroke();});\n  // knurl pattern\n  let k0=kn.indexOf(true);\n  if(k0>=0){\n    g.save();g.beginPath();g.rect(X0+k0*S,CY-12.5*S,(96-k0)*S,25*S);g.clip();\n    g.strokeStyle='#333';g.lineWidth=0.8;g.beginPath();\n    for(let x=X0+k0*S-60;x<X0+96*S+60;x+=6){\n      g.moveTo(x,CY-60);g.lineTo(x+120,CY+60);\n      g.moveTo(x,CY+60);g.lineTo(x+120,CY-60);}\n    g.stroke();g.restore();\n  }\n  // chuck (grips first 20 mm of the rod)\n  g.fillStyle='#555';g.fillRect(60,CY-75,X0+20*S-60,150);\n  g.fillStyle='#fff';g.font='13px Arial';g.fillText('Chuck',72,CY-85+15);\n  g.fillStyle='#888';g.fillRect(20,CY-30,40,60);\n  drawTool();\n  // dimensions\n  g.fillStyle='#000';g.font='13px Arial';g.strokeStyle='#06c';\n  [[20,'Ø50 (uncut)'],[38,'Ø45 × 20'],[58,'Ø35 × 20'],[78,'Ø25 × 20']].forEach(([c,t],i,a)=>{\n    g.beginPath();g.moveTo(X0+c*S,CY+85);g.lineTo(X0+c*S,CY+125);g.stroke();\n    g.fillText(t,X0+c*S+4,CY+110);});\n  g.beginPath();g.moveTo(X0+98*S,CY+85);g.lineTo(X0+98*S,CY+125);g.stroke();\n  g.fillText('Bar: Ø50 × 100 mm (20 mm in chuck, 2 mm faced off)',X0,CY+150);\n  g.font='bold 16px Arial';g.fillText(steps[Math.min(si,steps.length-1)].m,30,35);\n}\nfunction loop(){for(let i=0;i<2;i++)update();draw();requestAnimationFrame(loop);}\nloop();\n<\/script>\n<\/body>\n<\/html>", "Gear Assembly": "<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<title>Gear Assembly Animation<\/title>\n<style>\n  body{font-family:sans-serif;text-align:center;background:#f4f6f8}\n  canvas{background:#fff;border:1px solid #ccc;margin-top:8px}\n  button{padding:8px 14px;margin:4px;font-size:15px;cursor:pointer}\n  #info{max-width:640px;margin:6px auto;text-align:left}\n<\/style>\n<\/head>\n<body>\n<h2>Gear Assembly Animation<\/h2>\n<div>\n  <button id=\"bSpur\">Spur Gears<\/button>\n  <button id=\"bRack\">Rack and Pinion<\/button>\n  <button id=\"bPlanet\">Planetary<\/button>\n  <button id=\"bReplay\">Replay Assembly<\/button>\n<\/div>\n<canvas id=\"c\" width=\"640\" height=\"400\"><\/canvas>\n<div id=\"info\"><\/div>\n\n<script>\nwindow.addEventListener('load', function () {\n  var cv = document.getElementById('c');\n  var ctx = cv.getContext('2d');\n  var info = document.getElementById('info');\n  var notes = {\n    spur: \"<b>Spur gears:<\/b> parallel shafts. Transmit motion and torque at a fixed ratio (here 2:1, direction reverses). Pros: simple, efficient (about 98%). Cons: noisy at speed. Load: low to high, limited by tooth bending.\",\n    rack: \"<b>Rack and pinion:<\/b> converts rotation to linear motion. Pros: precise positioning. Cons: limited stroke, backlash. Load: moderate, set by tooth width and rack support.\",\n    planet: \"<b>Planetary set:<\/b> sun, 3 planets, ring and carrier on one axis. Pros: compact, high torque density, load shared by planets. Cons: complex assembly, heat. Load: very high.\"\n  };\n  var scene = 'spur';\n  var start = performance.now();\n\n  function setScene(s) {\n    scene = s;\n    start = performance.now();\n    info.innerHTML = notes[s];\n  }\n\n  document.getElementById('bSpur').addEventListener('click', function () { setScene('spur'); });\n  document.getElementById('bRack').addEventListener('click', function () { setScene('rack'); });\n  document.getElementById('bPlanet').addEventListener('click', function () { setScene('planet'); });\n  document.getElementById('bReplay').addEventListener('click', function () { setScene(scene); });\n\n  function gear(x, y, r, n, ang, color, internal) {\n    var tooth = r * 0.18;\n    var step = Math.PI * 2 / n;\n    var fr = [0, 0.2, 0.5, 0.7];\n    ctx.beginPath();\n    for (var i = 0; i < n; i++) {\n      var a = ang + i * step;\n      var ro = internal ? r - tooth : r + tooth;\n      var rads = [r, ro, ro, r];\n      for (var k = 0; k < 4; k++) {\n        var aa = a + fr[k] * step;\n        var px = x + Math.cos(aa) * rads[k];\n        var py = y + Math.sin(aa) * rads[k];\n        if (i === 0 && k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);\n      }\n    }\n    ctx.closePath();\n    if (internal) {\n      ctx.moveTo(x + r + 22, y);\n      ctx.arc(x, y, r + 22, 0, Math.PI * 2, true);\n      ctx.fillStyle = color;\n      ctx.fill('evenodd');\n    } else {\n      ctx.fillStyle = color;\n      ctx.fill();\n      ctx.beginPath();\n      ctx.arc(x, y, r * 0.2, 0, Math.PI * 2);\n      ctx.fillStyle = '#fff';\n      ctx.fill();\n    }\n  }\n\n  function label(t, x, y) {\n    ctx.fillStyle = '#222';\n    ctx.font = '16px sans-serif';\n    ctx.textAlign = 'center';\n    ctx.fillText(t, x, y);\n  }\n\n  function ease(t) { return 1 - Math.pow(1 - t, 3); }\n\n  function draw(now) {\n    ctx.clearRect(0, 0, 640, 400);\n    var el = (now - start) / 1000;\n    var p = ease(Math.max(0, Math.min(el / 2.5, 1)));\n    var spin = Math.max(0, el - 2.5) * 1.2;\n    label(p < 1 ? 'Assembling...' : 'Meshed and running', 320, 30);\n\n    if (scene === 'spur') {\n      var rA = 90, rB = 45, cy = 210;\n      gear(250, cy, rA, 20, spin, '#6fa8dc', false);\n      gear(250 + rA + rB + (1 - p) * 300, cy, rB, 10, -spin * 2 + Math.PI / 10 + Math.PI, '#f6b26b', false);\n      label('Driver (20T)', 250, 340);\n      label('Driven (10T)', 385, 340);\n    } else if (scene === 'rack') {\n      var r = 60, cx = 320, cy2 = 150;\n      var pitch = 2 * Math.PI * r / 16;\n      gear(cx, cy2 - (1 - p) * 150, r, 16, spin, '#6fa8dc', false);\n      var off = (spin * r) % pitch;\n      var ry = cy2 + r + 12 + (1 - p) * 150;\n      ctx.fillStyle = '#f6b26b';\n      ctx.fillRect(60, ry, 520, 30);\n      for (var x = 60 + off; x < 570; x += pitch) {\n        ctx.fillRect(x, ry - 10, pitch * 0.45, 10);\n      }\n      label('Pinion', cx, 60);\n      label('Rack moves linearly', 320, 390);\n    } else {\n      var px0 = 320, py0 = 210, rs = 36, rp = 36, orbit = 72, rr = 108;\n      gear(px0, py0, rr + 10 + (1 - p) * 250, 36, 0, '#d9d9d9', true);\n      var car = spin / 4;\n      gear(px0, py0, rs, 12, spin, '#e06666', false);\n      for (var i = 0; i < 3; i++) {\n        var a = car + i * Math.PI * 2 / 3;\n        var d = orbit + (1 - p) * 200;\n        gear(px0 + Math.cos(a) * d, py0 + Math.sin(a) * d, rp, 12, -(spin - car) + car + Math.PI / 12, '#93c47d', false);\n      }\n      label('Sun (red), Planets (green), Ring (grey)', 320, 390);\n    }\n    requestAnimationFrame(draw);\n  }\n\n  setScene('spur');\n  requestAnimationFrame(draw);\n});\n<\/script>\n<\/body>\n<\/html>", "Milling": "<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<title>Milling Process Animation<\/title>\n<style>\n  body{font-family:Arial,sans-serif;background:#1e2227;color:#eee;text-align:center;margin:10px}\n  canvas{background:#2b3038;border:2px solid #555;border-radius:6px}\n  button{padding:8px 12px;margin:3px;border:0;border-radius:5px;background:#3a7bd5;color:#fff;cursor:pointer}\n  button.on{background:#e67e22}\n  #info{max-width:760px;margin:8px auto;min-height:60px;font-size:15px}\n<\/style>\n<\/head>\n<body>\n<h2>Milling Machining Process<\/h2>\n<div id=\"modes\"><\/div>\n<div>\n  <button id=\"dir\">Rotation: Clockwise<\/button>\n  <button id=\"pause\">Pause<\/button>\n  <button id=\"restart\">Restart<\/button>\n  Speed <input id=\"spd\" type=\"range\" min=\"0.5\" max=\"4\" step=\"0.1\" value=\"1.5\">\n<\/div>\n<canvas id=\"c\" width=\"760\" height=\"400\"><\/canvas>\n<div id=\"info\"><\/div>\n\n<script>\nconst cv=document.getElementById('c'), ctx=cv.getContext('2d');\nconst stock=document.createElement('canvas'); stock.width=760; stock.height=400;\nconst sctx=stock.getContext('2d');\n\nconst SX=100, SY=120, SW=560, SH=160;       // stock (top view)\nconst modes=[\n {name:\"1. Face Milling\", r:70, teeth:6, view:\"top\",\n  path:t=>({x:SX-70+(SW+140)*t, y:SY+SH/2}),\n  info:\"FACE MILLING: The cutter axis is perpendicular to the surface. Teeth on the cutter face and periphery remove a thin layer to create a flat, smooth surface. Used for surfacing and squaring stock.\"},\n {name:\"2. Slab (Peripheral) Milling\", r:55, teeth:8, view:\"side\",\n  path:t=>({x:SX-60+(SW+120)*t, y:SY+SH/2-80+55-14}),\n  info:\"SLAB / PERIPHERAL MILLING: The cutter axis is parallel to the surface (side view). Teeth on the cylinder's circumference cut the depth shown. Rotation sets climb vs. conventional milling (toggle the rotation button).\"},\n {name:\"3. End Milling – Slot\", r:18, teeth:4, view:\"top\",\n  path:t=>({x:SX+20+(SW-40)*t, y:SY+SH/2}),\n  info:\"END MILLING (SLOT): An end mill plunges, then feeds along a straight path and cuts a slot or keyway equal to its diameter. Coolant and chip evacuation are important.\"},\n {name:\"4. Pocket & Contour Milling\", r:14, teeth:4, view:\"top\",\n  path:t=>pocketPath(t),\n  info:\"POCKET + PROFILE MILLING: The end mill spirals out to clear a rectangular pocket, then follows the outline (contour). This is typical CNC toolpath behavior with roughing then finishing passes.\"}\n];\nfunction pocketPath(t){\n  const cx=SX+SW/2, cy=SY+SH/2;\n  if(t<0.7){ // rectangular spiral outward\n    const u=t/0.7, a=u*Math.PI*2*5, k=u;\n    const w=30+ (SW/2-90)*k, h=20+(SH/2-30)*k*0.9;\n    const s=Math.cos(a), c=Math.sin(a);\n    const sq=(v)=>Math.sign(v)*Math.pow(Math.abs(v),0.25);\n    return {x:cx+w*sq(s), y:cy+h*sq(c)};\n  }\n  const u=(t-0.7)/0.3, w=SW/2-30, h=SH/2-12, p=u*4;\n  const f=p%1, e=Math.floor(p);\n  const pts=[[-w,-h],[w,-h],[w,h],[-w,h],[-w,-h]];\n  const A=pts[e],B=pts[e+1];\n  return {x:cx+A[0]+(B[0]-A[0])*f, y:cy+A[1]+(B[1]-A[1])*f};\n}\n\nlet mode=0, t=0, ang=0, cw=true, paused=false, last=null;\nconst mdiv=document.getElementById('modes');\nmodes.forEach((m,i)=>{\n  const b=document.createElement('button'); b.textContent=m.name;\n  b.onclick=()=>{mode=i; reset();}; mdiv.appendChild(b);\n});\nfunction reset(){\n  t=0; ang=0; last=null;\n  sctx.clearRect(0,0,760,400);\n  sctx.fillStyle=\"#b0b7c3\";\n  if(modes[mode].view===\"top\") sctx.fillRect(SX,SY,SW,SH);\n  else sctx.fillRect(SX,SY+SH/2-80,SW,160); // side view block\n  [...mdiv.children].forEach((b,i)=>b.className=i===mode?'on':'');\n  document.getElementById('info').textContent=modes[mode].info;\n}\ndocument.getElementById('dir').onclick=function(){cw=!cw; this.textContent=\"Rotation: \"+(cw?\"Clockwise\":\"Counter-clockwise\"); reset();};\ndocument.getElementById('pause').onclick=function(){paused=!paused; this.textContent=paused?\"Play\":\"Pause\";};\ndocument.getElementById('restart').onclick=reset;\n\nfunction drawCutter(p,m){\n  ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(ang);\n  ctx.fillStyle=\"#f1c40f\"; ctx.strokeStyle=\"#7d6608\"; ctx.lineWidth=2;\n  ctx.beginPath(); ctx.arc(0,0,m.r,0,Math.PI*2); ctx.fill(); ctx.stroke();\n  ctx.fillStyle=\"#c0392b\";\n  for(let i=0;i<m.teeth;i++){\n    ctx.save(); ctx.rotate(i*2*Math.PI/m.teeth);\n    ctx.beginPath(); ctx.moveTo(m.r,-4); ctx.lineTo(m.r+8,0); ctx.lineTo(m.r,4); ctx.fill();\n    ctx.restore();\n  }\n  ctx.fillStyle=\"#555\"; ctx.beginPath(); ctx.arc(0,0,Math.min(8,m.r/3),0,Math.PI*2); ctx.fill();\n  ctx.restore();\n}\nfunction label(txt,x,y,col){ctx.fillStyle=col||\"#fff\";ctx.font=\"14px Arial\";ctx.fillText(txt,x,y);}\n\nfunction frame(ts){\n  const spd=+document.getElementById('spd').value;\n  if(last===null) last=ts;\n  const dt=(ts-last)/1000; last=ts;\n  if(!paused){\n    t+=dt*0.07*spd; ang+=(cw?1:-1)*dt*12*spd;\n    if(t>1){ reset(); }\n  }\n  const m=modes[mode], p=m.path(Math.min(t,1));\n  // remove material\n  sctx.globalCompositeOperation=\"destination-out\";\n  sctx.beginPath(); sctx.arc(p.x,p.y,m.r,0,Math.PI*2); sctx.fill();\n  sctx.globalCompositeOperation=\"source-over\";\n\n  ctx.clearRect(0,0,760,400);\n  // base outline of original stock\n  ctx.strokeStyle=\"#667\"; ctx.setLineDash([5,5]);\n  if(m.view===\"top\") ctx.strokeRect(SX,SY,SW,SH); else ctx.strokeRect(SX,SY+SH/2-80,SW,160);\n  ctx.setLineDash([]);\n  ctx.drawImage(stock,0,0);\n  drawCutter(p,m);\n\n  // chips\n  ctx.fillStyle=\"#e0e0e0\";\n  if(!paused) for(let i=0;i<4;i++){\n    const a=Math.random()*Math.PI*2, d=m.r+Math.random()*25;\n    ctx.fillRect(p.x+Math.cos(a)*d,p.y+Math.sin(a)*d,3,3);\n  }\n  // annotations\n  label(m.view===\"top\"?\"TOP VIEW\":\"SIDE VIEW\",20,25,\"#9fd\");\n  label(\"Cutter rotation: \"+(cw?\"clockwise ↻\":\"counter-clockwise ↺\"),20,48);\n  label(\"Feed: \"+(m.view===\"top\"&&mode===3?\"toolpath\":\"→ (cutter travels right)\"),20,68);\n  if(m.view===\"side\"){\n    const climb=!cw; // cutter moving right: CCW = climb\n    label(climb?\"CLIMB MILLING (thin-to-thick chip, better finish)\":\"CONVENTIONAL MILLING (chip starts thin, ends thick)\",20,92,climb?\"#2ecc71\":\"#e67e22\");\n    label(\"Workpiece\",SX+SW/2-30,SY+SH/2+95,\"#bbb\");\n  } else label(\"Workpiece (grey) – removed material shown as empty area\",SX,SY+SH+30,\"#bbb\");\n  label(\"Progress: \"+Math.round(Math.min(t,1)*100)+\"%\",640,25);\n  requestAnimationFrame(frame);\n}\nreset(); requestAnimationFrame(frame);\n<\/script>\n<\/body>\n<\/html>", "Vernier & Micrometer": "<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<title>Vernier & Micrometer Reading Animation<\/title>\n<style>\n  body{font-family:Arial,sans-serif;max-width:900px;margin:20px auto;padding:0 10px}\n  button{padding:8px 14px;margin:4px;font-size:15px;cursor:pointer}\n  .active{background:#2563eb;color:#fff}\n  svg{width:100%;background:#f8fafc;border:1px solid #ccc;border-radius:8px}\n  #steps{background:#fff7e6;border-left:5px solid #f59e0b;padding:10px;font-size:18px;line-height:1.6}\n  input[type=range]{width:100%}\n<\/style>\n<\/head>\n<body>\n<h2>Reading a Vernier Caliper and a Micrometer<\/h2>\n<button id=\"tabV\" class=\"active\" onclick=\"setMode('v')\">Vernier Caliper<\/button>\n<button id=\"tabM\" onclick=\"setMode('m')\">Micrometer Screw Gauge<\/button>\n<svg id=\"svg\" viewBox=\"0 0 900 260\"><\/svg>\n<input type=\"range\" id=\"slider\" oninput=\"stopAnim();update(+this.value)\">\n<button onclick=\"animate()\">▶ Animate<\/button>\n<button onclick=\"stopAnim()\">⏸ Stop<\/button>\n<button onclick=\"randomVal()\">🎲 Random reading<\/button>\n<div id=\"steps\"><\/div>\n\n<script>\nlet mode='v', val=23.4, timer=null;\nconst svg=document.getElementById('svg'), sl=document.getElementById('slider');\nconst NS='http://www.w3.org/2000/svg';\nlet out='';\nfunction el(t,a,txt){out+=`<${t} ${Object.entries(a).map(([k,v])=>k+'=\"'+v+'\"').join(' ')}>${txt||''}<\/${t}>`}\nconst line=(x1,y1,x2,y2,c='#000',w=1)=>el('line',{x1,y1,x2,y2,stroke:c,'stroke-width':w});\nconst text=(x,y,s,sz=12,c='#000',anchor='middle')=>el('text',{x,y,'font-size':sz,fill:c,'text-anchor':anchor},s);\n\nfunction setMode(m){\n  mode=m; stopAnim();\n  document.getElementById('tabV').className=m=='v'?'active':'';\n  document.getElementById('tabM').className=m=='m'?'active':'';\n  if(m=='v'){sl.min=0;sl.max=40;sl.step=0.1;val=23.4}\n  else{sl.min=0;sl.max=25;sl.step=0.01;val=7.83}\n  sl.value=val; update(val);\n}\n\nfunction drawVernier(v){\n  v=Math.round(v*10)/10;\n  const S=20, x0=40;                 // 20 px per mm\n  const main=Math.floor(v+1e-9), n=Math.round((v-main)*10);\n  out='';\n  el('rect',{x:20,y:60,width:860,height:70,fill:'#dbeafe',stroke:'#1e3a8a'});\n  for(let i=0;i<=40;i++){\n    const x=x0+i*S, h=i%10==0?30:(i%5==0?22:15);\n    line(x,130,x,130-h,'#000',1);\n    if(i%10==0) text(x,95,i/10,14);   // cm labels\n  }\n  text(450,50,'Main scale (1 division = 1 mm, numbers in cm)',14,'#1e3a8a');\n  const off=x0+v*S;                  // vernier slides\n  el('rect',{x:off-10,y:130,width:10*0.9*S+30,height:70,fill:'#fde68a',stroke:'#92400e','fill-opacity':.9});\n  for(let i=0;i<=10;i++){\n    const x=off+i*0.9*S;\n    line(x,130,x,130+(i==n?42:25),i==n?'#dc2626':'#000',i==n?3:1);\n    text(x,190,i,12,i==n?'#dc2626':'#000');\n  }\n  // zero marker on main scale\n  line(off,60,off,130,'#16a34a',2);\n  text(off,250,'Vernier scale (10 div = 9 mm, LC = 0.1 mm)',14,'#92400e');\n  svg.innerHTML=out;\n  const mm=main+n/10;\n  steps([\n   `<b>Step 1 – Main scale:<\/b> the vernier zero is just past <b>${main} mm<\/b> → <span style=\"color:#16a34a\">${main} mm<\/span>`,\n   `<b>Step 2 – Vernier:<\/b> line number <b style=\"color:#dc2626\">${n}<\/b> lines up with a main-scale line`,\n   `<b>Step 3 – Multiply:<\/b> ${n} × 0.1 mm = ${(n/10).toFixed(1)} mm`,\n   `<b>Reading = ${main} + ${(n/10).toFixed(1)} = ${mm.toFixed(1)} mm<\/b>`]);\n}\n\nfunction drawMicrometer(v){\n  v=Math.round(v*100)/100;\n  const S=16, x0=60, dy=100;\n  const sleeve=Math.floor(v*2+1e-9)/2, t=Math.round((v-sleeve)*100);\n  out='';\n  el('rect',{x:x0,y:dy-35,width:25*S+20,height:70,fill:'#e5e7eb',stroke:'#374151'});\n  for(let i=0;i<=25;i++){\n    line(x0+i*S,dy,x0+i*S,dy-22,'#000',1.5);\n    if(i%5==0) text(x0+i*S,dy-27,i,13);\n    if(i<25) line(x0+i*S+S/2,dy,x0+i*S+S/2,dy+15,'#000',1);\n  }\n  line(x0,dy,x0+25*S+20,dy,'#000',2);\n  const ex=x0+v*S;                      // thimble edge\n  el('rect',{x:ex,y:dy-60,width:340,height:120,fill:'#fde68a','fill-opacity':.92,stroke:'#92400e'});\n  line(ex,dy-60,ex,dy+60,'#16a34a',3);\n  for(let k=-5;k<=5;k++){\n    const y=dy+k*10, d=((t+k)%50+50)%50;\n    line(ex,y,ex+(d%5==0?25:15),y,'#000',1);\n    if(d%5==0) text(ex+40,y+4,d,12);\n  }\n  line(ex,dy,ex+60,dy,'#dc2626',3);     // datum line\n  text(ex+110,dy+4,'← datum line',13,'#dc2626','start');\n  text(450,235,'Sleeve: 0.5 mm per mark • Thimble: 50 divisions • LC = 0.01 mm',14,'#92400e');\n  svg.innerHTML=out;\n  steps([\n   `<b>Step 1 – Sleeve (mm and half-mm):<\/b> last visible mark before the thimble edge = <span style=\"color:#16a34a\">${sleeve.toFixed(1)} mm<\/span>`,\n   `<b>Step 2 – Thimble:<\/b> the line on the datum line is <b style=\"color:#dc2626\">${t}<\/b>`,\n   `<b>Step 3 – Multiply:<\/b> ${t} × 0.01 mm = ${(t/100).toFixed(2)} mm`,\n   `<b>Reading = ${sleeve.toFixed(1)} + ${(t/100).toFixed(2)} = ${v.toFixed(2)} mm<\/b>`]);\n}\n\nfunction steps(a){document.getElementById('steps').innerHTML=a.join('<br>')}\nfunction update(v){val=v; mode=='v'?drawVernier(v):drawMicrometer(v)}\nfunction animate(){\n  stopAnim(); let v=+sl.min, max=+sl.max, step=mode=='v'?0.1:0.05;\n  timer=setInterval(()=>{ v+=step; if(v>max){stopAnim();return}\n    sl.value=v; update(v)}, mode=='v'?40:25);\n}\nfunction stopAnim(){clearInterval(timer)}\nfunction randomVal(){\n  stopAnim();\n  const v=mode=='v'? Math.round(Math.random()*400)/10 : Math.round(Math.random()*2500)/100;\n  sl.value=v; update(v);\n}\nsetMode('v');\n<\/script>\n<\/body>\n<\/html>"};

function show(n){f.srcdoc=pages[n];[...nav.children].forEach(b=>b.className=b.textContent===n?'on':'');}
names.forEach(n=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>show(n);nav.appendChild(b);});
